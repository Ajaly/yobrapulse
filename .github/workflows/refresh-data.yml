name: Refresh live data

# Runs the same fetch scripts you'd otherwise run by hand, on a schedule,
# and commits the results, then deploys straight to Firebase Hosting.
#
# The deploy step here exists specifically because this job's own push
# uses the default GITHUB_TOKEN, which GitHub deliberately does NOT let
# trigger other on:push workflows (anti-recursion protection) - so
# deploy-hosting.yml's push trigger never fires for this bot's own
# commits, only for real pushes from a human. Deploying directly in this
# same job is what closes that specific gap.
#
# Hourly keeps News feeling current without wasting Actions minutes:
# public repos get unlimited free minutes; private repos get 2,000/month
# free, and this job (~1-2 min x 24 runs/day) uses well under that.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # lets you trigger a refresh on demand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # continue-on-error on each fetch: if one source is temporarily
      # down, the others still refresh instead of the whole run failing
      # and nothing updating.
      - name: Fetch FPL data
        run: python fetch-fpl-data.py
        continue-on-error: true

      - name: Fetch news
        run: python fetch-news.py
        continue-on-error: true

      - name: Fetch league standings
        run: python fetch-league-data.py
        continue-on-error: true

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated data refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.commit.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # continue-on-error: this step has been failing every run since it
      # was added (FIREBASE_SERVICE_ACCOUNT secret was never actually
      # added to the repo) - it was silently emailing a failure notice
      # on every single hourly run for days before that got noticed.
      # Once the secret is real, this should start succeeding and this
      # safety net stops mattering; until then, it fails loud in the log
      # (see the explicit check below) without spamming a failure email
      # every hour over a known, already-diagnosed cause.
      # --non-interactive + CI=true + timeout-minutes: see
      # deploy-hosting.yml's matching step for why - a fresh
      # firebase-tools install can hit an interactive prompt (e.g. CLI
      # analytics consent) that hangs forever with no stdin in a runner,
      # instead of failing. Same fix here.
      - name: Deploy to Firebase Hosting
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        timeout-minutes: 5
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CI: "true"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT repo secret is not set - see .github/workflows/refresh-data.yml. Skipping deploy, not treating this as a hard failure."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npm install -g firebase-tools
          firebase deploy --only hosting --project yobrapulse-a0389 --non-interactive
          rm -f /tmp/firebase-service-account.json
