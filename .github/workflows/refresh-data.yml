name: Refresh live data

# Runs the same fetch scripts you'd otherwise run by hand, on a schedule,
# and commits the results, then deploys straight to Firebase Hosting.
#
# The deploy job here exists specifically because this workflow's own
# push uses the default GITHUB_TOKEN, which GitHub deliberately does NOT
# let trigger other on:push workflows (anti-recursion protection) - so
# deploy-hosting.yml's push trigger never fires for this bot's own
# commits, only for real pushes from a human. Deploying directly from
# this workflow is what closes that specific gap.
#
# Two separate jobs (refresh, deploy) rather than one, specifically so
# `deploy` can share deploy-hosting.yml's concurrency group without that
# also cancelling the data-fetch/commit work if a race is detected - see
# the deploy job below for the real incident this fixes.
#
# Hourly keeps News feeling current without wasting Actions minutes:
# public repos get unlimited free minutes; private repos get 2,000/month
# free, and this job (~1-2 min x 24 runs/day) uses well under that.

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # lets you trigger a refresh on demand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # continue-on-error on each fetch: if one source is temporarily
      # down, the others still refresh instead of the whole run failing
      # and nothing updating.
      - name: Fetch FPL data
        run: python fetch-fpl-data.py
        continue-on-error: true

      - name: Fetch news
        run: python fetch-news.py
        continue-on-error: true

      - name: Fetch league standings
        run: python fetch-league-data.py
        continue-on-error: true

      - name: Commit and push if data changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes, skipping commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Automated data refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Separate job (not a step in `refresh`) specifically so it can share
  # deploy-hosting.yml's concurrency group. Real incident this fixes: an
  # hourly scheduled run's deploy (unprotected by any concurrency
  # control, since it lived as a step inside the single `refresh` job)
  # finished its actual firebase deploy call AFTER several later, faster
  # deploy-hosting.yml runs for newer manual commits had already
  # deployed - silently reverting the live site to older content despite
  # every individual run reporting success. deploy-hosting.yml's own
  # cancel-in-progress fix only covered races WITHIN that one workflow,
  # not races BETWEEN it and this one - concurrency groups are scoped to
  # the repo, not a single workflow file, so using the identical group
  # name here closes that cross-workflow gap too.
  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: firebase-hosting-deploy
      cancel-in-progress: true
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # continue-on-error: this step failed every run for days before
      # the FIREBASE_SERVICE_ACCOUNT secret was actually added - fails
      # loud in the log via the explicit check below instead of
      # spamming a failure email every hour over a known cause.
      #
      # --non-interactive + CI=true + timeout-minutes: a fresh
      # firebase-tools install can hit an interactive prompt (e.g. CLI
      # analytics consent) that hangs forever with no stdin in a
      # runner, instead of failing.
      - name: Deploy to Firebase Hosting
        continue-on-error: true
        timeout-minutes: 5
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CI: "true"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT repo secret is not set - see .github/workflows/refresh-data.yml. Skipping deploy, not treating this as a hard failure."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npm install -g firebase-tools
          firebase deploy --only hosting --project yobrapulse-a0389 --non-interactive
          rm -f /tmp/firebase-service-account.json
