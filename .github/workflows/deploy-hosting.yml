name: Deploy to Firebase Hosting

# Fires on every real push to main (a manual commit, a merged PR) so
# Firebase Hosting never sits behind what's actually in the repo, which
# is what this whole workflow exists to fix - it was previously a
# manual "remember to run firebase deploy" step, repeatedly forgotten.
#
# Does NOT fire for refresh-data.yml's own bot commits - GitHub
# deliberately blocks the default GITHUB_TOKEN from triggering other
# on:push workflows (anti-recursion protection). That case is handled
# by a deploy step inside refresh-data.yml itself instead.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Real incident: pushing several commits in quick succession queued
# several of these runs close together. A slow one (cold npm install,
# 4-6 min) can finish its actual `firebase deploy` call AFTER a faster
# later run (warm npm cache, ~20s) already deployed the newer commit -
# silently overwriting newer live content with older content, with
# both runs still individually reporting "success" since neither one
# actually failed. Confirmed happening: a run for the latest commit
# reported success, but the live site still showed an older commit's
# content until a manual redeploy. This concurrency group makes GitHub
# cancel any older, still-running deploy for this workflow the moment
# a newer one starts, so only the latest commit's deploy can ever
# actually finish and take effect.
concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # continue-on-error: see refresh-data.yml's matching step for why -
      # same missing-secret cause, same "fail loud in the log, not via a
      # failure email" fix.
      #
      # --non-interactive + CI=true + timeout-minutes: real incident -
      # the first real run after the secret was finally added hung for
      # 6+ minutes with zero log output past "npm install", never
      # completing. firebase-tools can prompt interactively on a fresh
      # install (e.g. CLI error-reporting/analytics consent) - with no
      # human and no stdin in a GitHub Actions runner, that prompt waits
      # forever instead of failing, and GitHub's default 6-hour job
      # timeout means nothing would surface that for a very long time.
      # --non-interactive makes the CLI take defaults instead of
      # prompting; timeout-minutes is a hard backstop in case some other
      # prompt shows up that flag doesn't cover.
      - name: Deploy to Firebase Hosting
        continue-on-error: true
        timeout-minutes: 5
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CI: "true"
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT repo secret is not set - see .github/workflows/deploy-hosting.yml. Skipping deploy, not treating this as a hard failure."
            exit 0
          fi
          echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/firebase-service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json
          npm install -g firebase-tools
          firebase deploy --only hosting --project yobrapulse-a0389 --non-interactive
          rm -f /tmp/firebase-service-account.json
